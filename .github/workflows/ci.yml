name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build backend image
        run: docker build -t weatherfit-backend:latest ./backend

      - name: Build frontend image
        run: docker build -t weatherfit-frontend:latest .

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/mongodb.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl -n weatherfit rollout status deployment/weatherfit-backend
          kubectl -n weatherfit rollout status deployment/weatherfit-frontend
