apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherfit-frontend
  namespace: weatherfit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weatherfit-frontend
  template:
    metadata:
      labels:
        app: weatherfit-frontend
    spec:
      containers:
        - name: frontend
          image: weatherfit-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: weatherfit-frontend
  namespace: weatherfit
spec:
  type: NodePort
  selector:
    app: weatherfit-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
