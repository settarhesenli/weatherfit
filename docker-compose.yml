services:
  mongodb:
    image: mongo:8
    container_name: weatherfit-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: weatherfit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/weatherfit
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    depends_on:
      - mongodb

volumes:
  mongodb_data:
